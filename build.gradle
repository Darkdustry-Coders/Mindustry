project(":core"){
    apply plugin: "java-library"
    apply plugin: "kotlin"
    apply plugin: "kotlin-kapt"

    kapt{
        javacOptions{
            option("-source", "17")
            option("-target", "1.8")
        }
    }

    compileJava.options.fork = true

    task preGen {
        def rpath = "$rootDir/core"
        def nativeImage = project.getProperties()["nativeimage"] == "true"

        outputs.upToDateWhen { false }
        generateLocales()
        writeVersion()
        writeProcessors()
        writePlugins()

        def path = Paths.get("$rpath/build/generated/sources/buildtime")
        if (Files.exists(path)) Files.walkFileTree(path, new SimpleFileVisitor<java.nio.file.Path>() {
            @Override
            FileVisitResult visitFile(java.nio.file.Path file, BasicFileAttributes attrs) {
                Files.delete(file)
                return FileVisitResult.CONTINUE
            }

            @Override
            FileVisitResult postVisitDirectory(java.nio.file.Path file, IOException exc) {
                Files.delete(file)
                return FileVisitResult.CONTINUE
            }
        })

        Files.createDirectories(path.resolve("java/main/mindurka/coreplugin/extern/"))
        Files.createDirectories(path.resolve("java/main/mindustry"))

        def str = new StringWriter()
        def p = new PrintWriter(str)

        p.println("package mindurka.coreplugin.extern;")

        p.println("import mindustry.gen.Player;")
        p.println("import mindustry.game.Team;")
        p.println("import mindustry.Vars;")
        p.println("import mindustry.world.blocks.defense.OverdriveProjector;")

        p.println("public class Header {")

        p.println("    public static final Header lib;")
        p.println("    static {")
        p.println("        try {")
        p.println("            lib = (Header) Vars.mods.getMod(\"coreplugin\").loader.loadClass(\"mindurka.coreplugin.extern.HeaderI\").getField(\"INSTANCE\").get(null);")
        p.println("        } catch (Exception e) {")
        p.println("            throw new RuntimeException(e);")
        p.println("        }")
        p.println("    }")

        p.println("    public void onDisconnected(Player player) { throw new IllegalStateException(\"Not implemented!\"); }")
        p.println("    public boolean hasMindurkaCompat(Player player) { throw new IllegalStateException(\"Not implemented!\"); }")
        p.println("    public boolean onMapLoad() { throw new IllegalStateException(\"Not implemented!\"); }")
        p.println("    public boolean countAlive(Team team) { throw new IllegalStateException(\"Not implemented!\"); }")

        p.println("}")

        Files.write(path.resolve("java/main/mindurka/coreplugin/extern/Header.java"), str.toString().getBytes(StandardCharsets.UTF_8))

        str = new StringWriter()
        p = new PrintWriter(str)
        p.println("package mindustry;")

        // Yes, I have deliberatery made those into functions so it's not optimized by javac.
        // Native images, however, should remove the `isNative`/`shortcircuit` calls.
        // I love making jar builds slower so native image build works at all!
        p.println("public class NiMetadata {")
        p.println("    private NiMetadata() {}")
        p.println("    public static final boolean isNative = $nativeImage;")
        p.println("    public static boolean shortcircuit() { return $nativeImage; }")
        p.println("}")

        Files.write(path.resolve("java/main/mindustry/NiMetadata.java"), str.toString().getBytes(StandardCharsets.UTF_8))
    }

    task depsJar(type: Jar, dependsOn: [classes, ":server:dist"]){
        archiveClassifier = 'deps'
        from files(sourceSets.main.output.classesDirs)
        from{ configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) } }
        from zipTree("../server/build/libs/server-release.jar")
        from files("src/")
        from files("../../Arc/arc-core/src/")
        from files("../../Arc/extensions/arcnet/src/")
        from files("../../Arc/extensions/g3d/src/")
        from files("../../Arc/extensions/flabel/src/")
        from files("../../Arc/extensions/freetype/src/")
        from files("../server/src/")

        exclude("META-INF/**")
        exclude("vfxshaders/**")
        exclude("maps/**")
        exclude("baseparts/**")
        exclude("vfxshaders/**")
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    task sourcesJar(type: Jar, dependsOn: classes){
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }

    task assetsJar(type: Jar, dependsOn: ":tools:pack"){
        archiveClassifier = 'assets'
        from files("assets"){
            exclude "config", "cache", "music", "sounds", "sprites/fallback"
        }
    }

    task musicJar(type: Jar){
        archiveClassifier = 'music'
        from files("assets"){
            include "music/*", "sounds/*"
        }
    }

    dependencies{
        compileJava.dependsOn(preGen)

        api "at.yawk.lz4:lz4-java:1.10.2"
        api arcModule("arc-core")
        api arcModule("extensions:flabel")
        api arcModule("extensions:freetype")
        api arcModule("extensions:g3d")
        api arcModule("extensions:fx")
        api arcModule("extensions:arcnet")
        api "com.github.Anuken:rhino:$rhinoVersion"
        if(localArc && debugged()) api arcModule("extensions:recorder")
        if(localArc) api arcModule(":extensions:packer")

        annotationProcessor 'com.github.Anuken:jabel:0.9.0'
        compileOnly project(":annotations")
        if(!project.hasProperty("noKapt")) kapt project(":annotations")
    }

    afterEvaluate{
        task mergedJavadoc(type: Javadoc){
            def blacklist = [project(":server"), project(":annotations")]
            // if(findProject(":android") != null){
            //     blacklist += project(":android")
            // }

            source rootProject.subprojects.collect{ project ->
                if(!blacklist.contains(project) && project.hasProperty("sourceSets")){
                    return project.sourceSets.main.allJava
                }
            }

            classpath = files(rootProject.subprojects.collect { project ->
                if(!blacklist.contains(project) && project.hasProperty("sourceSets")){
                    return project.sourceSets.main.compileClasspath
                }
            })
            destinationDir = new File(buildDir, 'javadoc')
        }
    }

    gradle.taskGraph.whenReady{
        //these are completely unnecessary
        tasks.kaptGenerateStubsKotlin.onlyIf{ false }
        tasks.compileKotlin.onlyIf{ false }
    }

    //comp** classes are only used for code generation
    jar{
        exclude("mindustry/entities/comp/**")
        exclude("mindurka/coreplugin/extern/HeaderI.class")
    }
}

project(":server"){
    apply plugin: "java"

    dependencies{
        implementation project(":core")
        implementation arcModule("backends:backend-headless")
        annotationProcessor 'com.github.Anuken:jabel:0.9.0'
    }
}

project(":tests"){
    apply plugin: "java"

    dependencies{
        testImplementation project(":core")
        testImplementation "org.junit.jupiter:junit-jupiter-params:5.7.1"
        testImplementation "org.junit.jupiter:junit-jupiter-api:5.7.1"
        testImplementation arcModule("backends:backend-headless")
        testImplementation "org.json:json:20230618"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.7.1"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    tasks.withType(JavaCompile){
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = JavaVersion.VERSION_17
        options.compilerArgs.addAll(['--release', '17'])
    }

    test{
        //fork every test so mods don't interact with each other
        forkEvery = 1
        jvmArgs = ["-XX:+HeapDumpOnOutOfMemoryError"]
        useJUnitPlatform()
        workingDir = new File("../core/assets")
        testLogging{
            exceptionFormat = 'full'
            showStandardStreams = true
        }
    }
}

project(":tools"){
    apply plugin: "java"

    dependencies{
        implementation project(":core")

        implementation arcModule("natives:natives-desktop")
        implementation arcModule("natives:natives-freetype-desktop")
        implementation arcModule("backends:backend-headless")

        implementation("com.google.guava:guava:33.3.1-jre")
        annotationProcessor 'com.github.Anuken:jabel:0.9.0'
    }
}

project(":annotations"){
    apply plugin: "java-library"

    dependencies{
        implementation 'com.squareup:javapoet:1.12.1'
        implementation arcModule("arc-core")
    }
}

configure([":core", ":server"].collect{project(it)}){
    java{
        withJavadocJar()
        withSourcesJar()
    }

    publishing{
        publications{
            maven(MavenPublication){
                groupId 'anuken'

                from components.java
            }
        }
        repositories {
            maven {
                url = "file://$workspacePath/.cache/maven"
            }
        }
    }
}

task deployAll{
    task cleanDeployOutput{
        doFirst{
            if(getBuildVersion() == "custom build" || getBuildVersion() == "") throw new IllegalArgumentException("----\n\nSET A BUILD NUMBER FIRST!\n\n----")
            if(!project.hasProperty("release")) throw new IllegalArgumentException("----\n\nSET THE RELEASE PROJECT PROPERTY FIRST!\n\n----")

            delete{
                delete "deploy/"
            }
        }
    }

    dependsOn cleanDeployOutput
    dependsOn "desktop:packrLinux64"
    dependsOn "desktop:packrWindows64"
    dependsOn "desktop:packrMacOS"
    if(versionModifier != "steam"){
        dependsOn "server:deploy"
        dependsOn "android:deploy"
    }
}

task resolveDependencies{
    doLast{
        rootProject.allprojects{ project ->
            Set<Configuration> configurations = project.buildscript.configurations + project.configurations
            configurations.findAll{c -> c.canBeResolved}.forEach{c -> c.resolve()}
        }
    }
}
